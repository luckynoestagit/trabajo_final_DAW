<div class="register-inner">
  <span class="t-tag">Crear cuenta</span>
  <h1 class="register-title">Siéntate con <em>nosotros</em>.</h1>
  <p class="register-lead">Acceso a reservas, pedidos con un clic y el calendario de eventos.</p>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="field">
        <label>Nombre</label>
        <input class="input" type="text" formControlName="nombre" placeholder="Tu nombre"
               [class.is-invalid]="registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched">
        @if (registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched) {
          <span class="field-error">Obligatorio</span>
        }
      </div>
      <div class="field">
        <label>Apellidos</label>
        <input class="input" type="text" formControlName="apellidos" placeholder="Tus apellidos"
               [class.is-invalid]="registerForm.get('apellidos')?.invalid && registerForm.get('apellidos')?.touched">
      </div>
      <div class="field" style="grid-column: span 2">
        <label>Email</label>
        <input class="input" type="email" formControlName="email" placeholder="tu@email.com"
               [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
      </div>
      <div class="field">
        <label>Teléfono</label>
        <input class="input" type="tel" formControlName="telefono" placeholder="+34 ...">
      </div>
      <div class="field">
        <label>Edad</label>
        <input class="input" type="number" formControlName="edad" placeholder="Mínimo 18" min="18">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input class="input" type="password" formControlName="password1" placeholder="Min. 8 caracteres">
      </div>
      <div class="field">
        <label>Repetir contraseña</label>
        <input class="input" type="password" formControlName="password2">
      </div>
      <div class="field" style="grid-column: span 2">
        <label>Dirección</label>
        <input class="input" type="text" formControlName="direccion" placeholder="Tu dirección completa">
      </div>
    </div>

    <label class="check-row">
      <input type="checkbox"> Acepto los <a href="#">términos</a> y <a href="#">política de privacidad</a>.
    </label>

    @if (errorMessage) {
      <p class="error-general">{{ errorMessage }}</p>
    }

    <button class="btn-primary" type="submit">Crear cuenta →</button>
  </form>

  <p class="register-foot">
    ¿Ya tienes cuenta? <a (click)="onLoginClick()">Inicia sesión</a>
  </p>
</div>
