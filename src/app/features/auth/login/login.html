<div class="login-inner">
  <span class="t-tag">Acceso · clientes</span>
  <h1 class="login-title">Bienvenido,<br/><em>pasa adentro</em>.</h1>
  <p class="login-lead">Entra para gestionar tus reservas, pedidos y direcciones guardadas.</p>

  <form [formGroup]="formLogin" (ngSubmit)="iniciarSesion()">
    <div class="field">
      <label>Email</label>
      <input class="input" type="email" formControlName="email" placeholder="tu@email.com">
    </div>
    <div class="field" style="margin-top: 18px">
      <label>Contraseña</label>
      <input class="input" type="password" formControlName="password" placeholder="••••••••">
    </div>

    <button class="btn-primary" type="submit">Entrar →</button>
  </form>

  <div class="login-divider"><span>o</span></div>
  <button class="btn-ghost" (click)="onRegisterClick()">Continuar con Google</button>

  <p class="login-foot">
    ¿Primera vez por aquí?
    <a (click)="onRegisterClick()">Crea una cuenta</a>
  </p>
</div>
