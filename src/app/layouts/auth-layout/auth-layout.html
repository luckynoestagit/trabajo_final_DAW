<div class="auth-wrap">

  <!-- Panel izquierdo — imagen + cita -->
  <aside class="auth-panel" [class.slide-right]="typePageForm === 'register'">
    <div class="auth-panel__bg" style="background-image: url('assets/img/mesa.jpg')"></div>
    <div class="auth-panel__overlay"></div>
    <div class="auth-panel__content">
      <a class="auth-brand" (click)="togglePageForm('login')">Temporada</a>
      @if (typePageForm === 'login') {
        <p class="auth-quote">"Cocinar lo que la tierra ofrece, cuando lo ofrece."</p>
        <span class="auth-quote-attr">— Equipo Temporada, 2025</span>
      } @else {
        <p class="auth-quote">"Únete a la mesa."</p>
        <span class="auth-quote-attr">— Desde 2025</span>
      }
    </div>
    <div class="auth-marquee">
      <div class="auth-marquee__track">
        <span>PRODUCTO LOCAL</span><span class="dot"></span>
        <span>DEL CAMPO A TU MESA</span><span class="dot"></span>
        <span>PRODUCTO LOCAL</span><span class="dot"></span>
        <span>DEL CAMPO A TU MESA</span><span class="dot"></span>
      </div>
    </div>
  </aside>

  <!-- Panel derecho — formulario -->
  <main class="auth-form-panel">
    @if (typePageForm === 'login') {
      <app-login></app-login>
    } @else {
      <app-register></app-register>
    }
  </main>

</div>
