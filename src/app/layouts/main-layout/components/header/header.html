<div class="header">
  <div class="row align-items-center">

    <div class="col d-flex justify-content-start gap-3 align-items-center">
      <button type="button" class="btn-menu" (click)="cambiarEstadoMenu()">
        <span></span>
        Menú
      </button>

    </div>

    <div class="col d-flex justify-content-center">
      <a routerLink="/">
        <img class="img-logo" src="../../../../../assets/img/logo.png" alt="Temporada">
      </a>
    </div>

    <div class="col d-flex justify-content-end gap-3 me-3 align-items-center">
      <button class="icon-btn" (click)="toggleBuscar()" title="Buscar">
        <i class="bi bi-search fs-5"></i>
      </button>
      <a class="icon-btn carrito-btn" routerLink="/carrito" title="Carrito">
        <i class="bi bi-cart-fill fs-5"></i>
        @if (cantidadCarrito() > 0) {
          <span class="carrito-badge">{{ cantidadCarrito() }}</span>
        }
      </a>
      <a class="icon-btn" routerLink="/cuenta" title="Mi cuenta">
        <i class="bi bi-person-fill fs-5"></i>
      </a>
    </div>

  </div>
</div>

@if (openMenu()) {
  <app-menu (openMenuDesdeHeader)="cambiarEstadoMenu()"></app-menu>
}

@if (buscadorAbierto()) {
  <div class="buscador-overlay" (click)="toggleBuscar()"></div>
  <div class="buscador-modal">
    <input class="buscador-input" type="text"
           placeholder="¿Qué buscas?"
           [(ngModel)]="terminoBusqueda"
           (keyup.enter)="buscar()"
           autofocus>
    <button class="buscador-btn" (click)="buscar()">Buscar</button>
  </div>
}
